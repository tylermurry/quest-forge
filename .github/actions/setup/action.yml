name: Set up the workspace
description: Node 24, pnpm through corepack (as the repo pins it) and an install from the lockfile.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Enable corepack
      shell: bash
      run: corepack enable
    - name: Install dependencies
      shell: bash
      run: corepack pnpm install --frozen-lockfile
