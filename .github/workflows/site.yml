# Deploys packages/site (the splash page and /play) and the docs (/docs/) to Cloudflare on every push to main.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: corepack pnpm check
      - run: corepack pnpm --filter @questforge/site build
      # The docs are served from /docs/ of the same Workers assets (baseUrl "/docs/", trailingSlash true).
      - run: corepack pnpm --filter @questforge/docs build
      - name: Add the docs to the site assets
        run: |
          rm -rf packages/site/dist/docs
          cp -R docs/build packages/site/dist/docs
      - name: Deploy to Cloudflare
        working-directory: packages/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the site."
            exit 1
          fi
          corepack pnpm exec wrangler deploy
