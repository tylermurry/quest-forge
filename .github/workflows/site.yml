# Deploys packages/site (the splash page and /play), the user manual (/docs/) and the developer docs (/dev-docs/) to Cloudflare on every push to main.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: corepack pnpm check
      - run: corepack pnpm --filter @questforge/site build
      # Both docs sites are served from the same Workers assets: the manual under /docs/ and the developer docs
      # under /dev-docs/ (each site's baseUrl matches its folder; trailingSlash true).
      - run: corepack pnpm --filter @questforge/docs --filter @questforge/dev-docs build
      - name: Add the docs to the site assets
        run: |
          rm -rf packages/site/dist/docs packages/site/dist/dev-docs
          cp -R docs/build packages/site/dist/docs
          cp -R dev-docs/build packages/site/dist/dev-docs
      - name: Deploy to Cloudflare
        working-directory: packages/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the site."
            exit 1
          fi
          corepack pnpm exec wrangler deploy
