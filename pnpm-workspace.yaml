packages:
  - packages/*
  - templates/*
  - docs

# Wrangler's bundler and local runtime (packages/site, D157) need their install scripts.
allowBuilds:
  esbuild: true
  workerd: true
  # Docusaurus (docs): core-js only prints a donation banner.
  core-js: false

minimumReleaseAgeExclude:
  - miniflare@5.20261109.0-beta
  - wrangler@4.159.0

# Security advisories in Docusaurus's build-time dependencies (docs, DEP-4). Docusaurus 3.10.2 is the
# latest release and still pulls the vulnerable versions. Each entry only matches the vulnerable range,
# so remove it once Docusaurus ships a patched dependency.
overrides:
  # GHSA-m5mm-p8h7-m29v and two earlier serialize-javascript advisories (via webpack plugins).
  "serialize-javascript@<7.1.3": 7.1.4
  # tinypool critical advisories (via @docusaurus/core).
  "tinypool@<2.1.2": 2.1.2
  # uuid advisory (via webpack-dev-server, dev server only).
  "uuid@<11.1.1": 11.1.1
